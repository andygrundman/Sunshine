---
# Fork workflow: Windows + macOS Sunshine builds, mirroring the moonlight-qt fork's build.yml.
# Reuses upstream's ci-windows.yml / ci-macos.yml (workflow_call) with publish_release=false,
# so all signing/notarization/release steps are skipped and no secrets are required.
# Note: these are stock (non-PyroWave) hosts — the PyroWave encoder is Linux-only.
name: Build Desktop (Windows/macOS)
permissions:
  contents: read

on:
  push:
    branches:
      - pyrowave-codec
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Set version
        id: ver
        shell: bash
        # Numeric components only: Windows installer versioning rejects hex SHAs.
        run: echo "version=0.0.${{ github.run_number }}" >> "${GITHUB_OUTPUT}"

  build-windows:
    needs: setup
    uses: ./.github/workflows/ci-windows.yml
    with:
      publish_release: 'false'
      release_commit: ${{ github.sha }}
      release_version: ${{ needs.setup.outputs.version }}

  build-macos:
    needs: setup
    uses: ./.github/workflows/ci-macos.yml
    with:
      publish_release: 'false'
      release_commit: ${{ github.sha }}
      release_version: ${{ needs.setup.outputs.version }}
